<div class="content-panel" id="panel-organizer-reviews" style="min-height: calc(100vh - 250px);">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="mb-0">主辦單位申請審核</h2>
        <div class="d-flex align-items-center">
            <label class="me-2 text-muted small">狀態：</label>
            <select class="form-select form-select-sm bg-dark text-white border-secondary" id="organizerStatusFilter"
                style="width: 150px;">
                <option value="0">待審核</option>
                <option value="1">使用中</option>
                <option value="2">已停權</option>
            </select>
        </div>
    </div>

    <div class="row g-4" id="organizerReviewList">
        <!-- 待審核主辦單位卡片將透過 JavaScript 動態載入 -->
        <div class="col-12 text-center py-5">
            <div class="spinner-border text-primary" role="status">
                <span class="visually-hidden">載入中...</span>
            </div>
            <p class="mt-2 text-muted">正在載入列表...</p>
        </div>
    </div>

    <!-- 分頁按鈕容器 - 還原為最穩定的 mt-auto 佈局 -->
    <div class="d-flex justify-content-center mt-auto pt-5 pb-3" id="organizerPagination">
        <!-- 分頁按鈕將透過 JavaScript 動態生成 -->
    </div>
    <!-- 駁回原因輸入 Modal -->
    <div class="modal fade" id="rejectReasonModal" tabindex="-1" aria-hidden="true" style="z-index: 1060;">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content bg-dark text-white border-secondary">
                <div class="modal-header border-secondary">
                    <h5 class="modal-title">駁回申請</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"
                        aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <p class="text-muted mb-2">請輸入駁回原因：</p>
                    <textarea class="form-control bg-dark text-white border-secondary" id="rejectReasonInput" rows="4"
                        placeholder="例如：銀行帳戶名稱與負責人不符..."></textarea>
                    <div class="form-text text-white-50">若未輸入，系統將使用預設理由。</div>
                </div>
                <div class="modal-footer border-secondary">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                    <button type="button" class="btn btn-danger" id="btnConfirmReject">確認駁回</button>
                </div>
            </div>
        </div>
    </div>
</div>
