<div class="orders-management">
    <h2 class="mb-4"><i class="fas fa-ticket-alt me-2"></i>活動訂單</h2>

    <!-- Filter Bar -->
    <div class="card border-secondary bg-dark mb-4">
        <div class="card-body">
            <div class="row g-3">
                <div class="col-md-3">
                    <label class="form-label">進行中活動</label>
                    <select class="form-select" name="activeEvent" id="activeEvent">
                        <option value="">全部活動</option>
                        <option th:each="events: ${activeEvents}" th:text="${events.title}" th:value="${events.eventId}">活動名稱</option>
                    </select>
                </div>
                <div class="col-md-3">
                    <label class="form-label">已結束活動</label>
                    <select class="form-select" id="finishedEvent" name="finishedEvent">
                        <option value="">全部活動</option>
                        <option th:each="events: ${finishedEvents}" th:text="${events.title}" th:value="${events.eventId}">活動名稱</option>
                    </select>
                </div>
                <div class="col-md-2">
                    <label class="form-label">訂單狀態</label>
                    <select class="form-select" id="filterStatus">
                        <option value="">全部</option>
                        <option value="paid">已付款</option>
                        <option value="used">已核銷</option>
                    </select>
                </div>
                <div class="col-md-3">
                    <label class="form-label">搜尋</label>
                    <input type="text" class="form-control" name="buyer" id="searchOrder" placeholder="訂單編號 / 購票人">
                </div>
                <div class="col-md-1 d-flex align-items-end">
                    <button class="btn btn-primary w-100" id="btnApplyFilter">查詢</button>
                </div>
            </div>
<!--             <div class="d-flex gap-2 mt-3"> -->
<!--                 <button class="btn btn-success ms-auto" id="btnOpenScanner"> -->
<!--                     <i class="fas fa-qrcode"></i> 掃描核銷 -->
<!--                 </button> -->
<!--             </div> -->
        </div>
    </div>
    <!-- Orders Table -->
    <div class="card border-secondary bg-dark">
        <div class="table-responsive">
        <div id="orderListContainer">
            <table class="table table-dark table-hover mb-0" id="ordersTable" th:fragment="orderTableBody">
                <thead>
                    <tr>
                        <th>訂單編號</th>
                        <th>活動</th>
                        <th>購票人</th>
                        <th>金額</th>
                        <th>狀態</th>
                        <th>操作</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- Mock Data -->
                    <tr th:each="events: ${eventOrderList}">
                        <td th:text="${events.eventOrderId}">#MOM2024122801</td>
                        <td th:text="${events.event.title}">五月天演唱會</td>
                        <td th:text="${events.member.name}">陳小明</td>
                        <td th:text="${events.payable}">NT$ 2,400</td>
                        <td>
                        	<span class="badge bg-success" th:if="${events.payStatus ==1}">已付款</span>
							<span class="badge bg-warning" th:if="${events.payStatus ==2}">申請退款</span>
							<span class="badge bg-danger" th:if="${events.payStatus ==3}">已退款</span>
							<span class="badge bg-primary" th:if="${events.payStatus ==4}">退款已駁回</span>
                        </td>
                        <td><button class="btn btn-sm btn-outline-secondary orderInformation" th:data-id="${events.eventOrderId}">查看</button></td>
                    </tr>
                </tbody>
            </table>
            </div>
        </div>
    </div>
</div>

<div class="modal fade" id="orderDetailModal" tabindex="-1">
    <div class="modal-dialog modal-lg modal-dialog-centered">
        <div class="modal-content bg-dark text-white border-secondary">
            <div class="modal-header border-secondary">
                <h5 class="modal-title"><i class="fas fa-search me-2"></i>訂單詳情</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body"  th:fragment="order-body">
                <div class="row"  th:if="${eventOrder != null}">
                    <div class="col-md-6">
                        <h6 class="text-muted mb-3">訂單資訊</h6>
                        <table class="table table-dark table-sm">
                            <tr>
                                <td class="text-muted">訂單編號</td>
                                <td th:text="${eventOrder.eventOrderId}">#MOM2025010301</td>
                            </tr>
                            <tr>
                                <td class="text-muted">活動名稱</td>
                                <td th:text="${eventOrder.event.title}">2025新年音樂會｜維也納之夜</td>
                            </tr>
                            <tr>
                                <td class="text-muted">購買日期</td>
                                <td th:text="${#temporals.format(eventOrder.createdAt, 'yyyy-MM-dd HH:mm')}">2025/01/03 14:20</td>
                            </tr>
                            <tr>
                                <td class="text-muted">訂單總額</td>
                                <td th:text="${eventOrder.total}">NT$ 5,600</td>
                            </tr>
                            <tr>
                                <td class="text-muted">使用代幣</td>
                                <td class="text-danger"  th:text="${eventOrder.tokenUsed}">NT$ 3,600</td>
                            </tr>
                            <tr>
                                <td class="text-muted">付款金額</td>
                                <td class="text-warning"  th:text="${eventOrder.payable}">NT$ 3,600</td>
                            </tr>

                        </table>
                    </div>
                    <div class="col-md-6">
                        <h6 class="text-muted mb-3">訂購者資訊</h6>
                        <table class="table table-dark table-sm">
                        	<tr>
                                <td class="text-muted">會員編號</td>
                                <td th:text="${eventOrder.member.memberId}">王小明</td>
                            </tr>                        
                            <tr>
                                <td class="text-muted">會員名字</td>
                                <td th:text="${eventOrder.member.name}">王小明</td>
                            </tr>
                            <tr>
                                <td class="text-muted">Email</td>
                                <td th:text="${eventOrder.member.account}">wang@example.com</td>
                            </tr>
                            <tr>
                                <td class="text-muted">連絡電話</td>
                                <td th:text="${eventOrder.member.phone}">2025/01/07 09:30</td>
                            </tr>

                        </table>
                    </div>
                </div>
               <div class="mt-3 p-3 border border-secondary border-start border-4 rounded bg-dark" style="--bs-bg-opacity: .95;">
                    <h6 class="bg-dark rounded-circle me-2">訂單明細</h6>
                    <div class="card-body text-bg-dark">
                        <ul style="list-style: none;">
                        	<li th:each="entry : ${itemCount}">
                        		<span th:text="${entry.key}"></span>
                        		<span th:text="'   x' +${entry.value}"></span>
                        	</li>
                        </ul>
                    </div>
                </div>
        </div>
    </div>
</div>
